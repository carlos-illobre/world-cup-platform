version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--configFile=/traefik/traefik.yml"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./traefik/traefik.yml:/traefik/traefik.yml:ro
      - ./traefik/traefik-routes.yml:/traefik/traefik-routes.yml:ro
    networks:
      - world-cup-platform
    restart: unless-stopped

  injury-api:
    build:
      context: ./injury-api
      dockerfile: Dockerfile
    container_name: injury-api
    ports:
      - "${INJURY_API_HOST_PORT:-8000}:${INJURY_API_CONTAINER_PORT:-8000}"
    environment:
      DATA_DIR: /service/data
      SERVER_HOST: ${INJURY_API_HOST:-0.0.0.0}
      SERVER_PORT: ${INJURY_API_CONTAINER_PORT:-8000}
      SERVER_RELOAD: ${SERVER_RELOAD:-false}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://${INJURY_API_HOST_INTERNAL:-api.localhost}}"
      INJURY_API_URL: "${INJURY_API_URL:-http://localhost:8000}"
    command: [ "/bin/sh", "-c", "echo \"Injury API disponible en ${INJURY_API_URL:-http://localhost:8000}\" && exec python -m app" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:${INJURY_API_CONTAINER_PORT:-8000}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - world-cup-platform
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: development
      args:
        VITE_INJURY_API_BASE_URL: "${VITE_INJURY_API_BASE_URL:-http://localhost:8000}"
    container_name: injury-dashboard
    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:${DASHBOARD_CONTAINER_PORT:-3000}"
    volumes:
      - ./dashboard/src:/app/src
    environment:
      DASHBOARD_URL: "${DASHBOARD_URL:-http://localhost:3000}"
    command: [ "/bin/sh", "-c", "echo \"Dashboard dev disponible en ${DASHBOARD_URL:-http://localhost:3000}\" && exec npm run dev -- --host 0.0.0.0 --port ${DASHBOARD_CONTAINER_PORT:-3000}" ]
    depends_on:
      injury-api:
        condition: service_healthy
    networks:
      - world-cup-platform
    restart: unless-stopped

networks:
  world-cup-platform:
    driver: bridge
