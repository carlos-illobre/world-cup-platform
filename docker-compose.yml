version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--configFile=/traefik/traefik.yml"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./traefik/traefik.yml:/traefik/traefik.yml:ro
      - ./traefik/traefik-routes.yml:/traefik/traefik-routes.yml:ro
    networks:
      - world-cup-platform
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: world-cup-api
    ports:
      - "${INJURY_API_HOST_PORT:-8000}:8000"
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: "*"
    networks:
      - world-cup-platform
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: development
      args:
        VITE_INJURY_API_BASE_URL: "${VITE_INJURY_API_BASE_URL:-http://localhost:8000}"
    container_name: injury-dashboard
    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:${DASHBOARD_CONTAINER_PORT:-3000}"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      DASHBOARD_URL: "${DASHBOARD_URL:-http://localhost:3000}"
    command: [ "/bin/sh", "-c", "echo \"Dashboard dev disponible en ${DASHBOARD_URL:-http://localhost:3000}\" && exec npm run dev -- --host 0.0.0.0 --port ${DASHBOARD_CONTAINER_PORT:-3000}" ]
    depends_on:
      - backend
    networks:
      - world-cup-platform
    restart: unless-stopped

networks:
  world-cup-platform:
    driver: bridge
