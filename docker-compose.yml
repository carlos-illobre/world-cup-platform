version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_HOST=${API_HOST}
      - DASHBOARD_HOST=${DASHBOARD_HOST}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - world-cup-platform
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: world-cup-api
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: "https://${DASHBOARD_HOST}"
    networks:
      - world-cup-platform
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: ${DASHBOARD_BUILD_TARGET:-development}
      args:
        VITE_INJURY_API_BASE_URL: "${VITE_INJURY_API_BASE_URL:-https://api.localhost}"
    container_name: injury-dashboard
    volumes:
      # En dev monta el código local, en prod usa un volumen nombrado para no sobrescribir la build
      - ${DASHBOARD_SRC_VOLUME:-./dashboard}:/app
      - /app/node_modules
    environment:
      DASHBOARD_URL: "https://${DASHBOARD_HOST}"
      VITE_INJURY_API_BASE_URL: "${VITE_INJURY_API_BASE_URL}"
    depends_on:
      - backend
    networks:
      - world-cup-platform
    restart: unless-stopped

networks:
  world-cup-platform:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  dashboard-prod-data:
