services:
  world-cup-injury-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: world-cup-injury-api
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /service/data
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      SERVER_RELOAD: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
