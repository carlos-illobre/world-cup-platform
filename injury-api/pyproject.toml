[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "world-cup-injury-api"
version = "1.0.0"
description = "API REST para pronosticar riesgo de lesión en el Mundial 2026."
# Alineado con la imagen base del Dockerfile
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",  # Para tipar y validar variables de entorno
    "cachetools>=5.3.0",         # Para optimizar la performance de los endpoints
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
start = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]