# Traefik Static Configuration - PRODUCCIÓN CON LET'S ENCRYPT
# Usar como: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  debug: false

# Entry points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          regex: "^http://(.*)$"
          replacement: "https://$1"
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        options: default
  traefik:
    address: ":8080"

# Provider configuration
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: world-cup-platform_default
  file:
    filename: /traefik/traefik-routes-prod.yml
    watch: true

# Certificate Resolver - Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${TRAEFIK_ACME_EMAIL:-admin@example.com}"
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

# Logging
log:
  level: INFO
