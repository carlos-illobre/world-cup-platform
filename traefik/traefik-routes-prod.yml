# Traefik Dynamic Configuration - PRODUCCIÓN
# Este archivo se usa junto con labels de servicios para routing automático
# Las rutas principales se definen mediante labels en docker-compose.prod.yml

http:
  routers:
    # Traefik Dashboard
    traefik-dashboard:
      rule: "Host(`${TRAEFIK_DASHBOARD_HOST}`)"
      service: "api@internal"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

  services: {}

# Configuración de TLS
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
