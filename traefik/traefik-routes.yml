# Traefik Dynamic Configuration - LOCAL DEVELOPMENT
# Rutas estáticas para desarrollo local

http:
  routers:
    # API Router
    api:
      rule: "Host(`api.localhost`) || Host(`localhost`) && PathPrefix(`/api`)"
      service: injury-api-service
      middlewares:
        - "compression"
      entryPoints:
        - web

    # Dashboard Router
    dashboard:
      rule: "Host(`dashboard.localhost`) || Host(`localhost:3000`)"
      service: dashboard-service
      middlewares:
        - "compression"
        - "static-cache"
      entryPoints:
        - web

    # Traefik Dashboard
    traefik-dashboard:
      rule: "Host(`traefik.localhost`)"
      service: "api@internal"
      entryPoints:
        - web

  middlewares:
    compression:
      compress: {}
    static-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=31536000"

  services:
    injury-api-service:
      loadBalancer:
        servers:
          - url: "http://injury-api:8000"

    dashboard-service:
      loadBalancer:
        servers:
          - url: "http://injury-dashboard:3000"
