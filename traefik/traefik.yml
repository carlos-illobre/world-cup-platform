# Traefik Static Configuration - LOCAL DEVELOPMENT
# Para desarrollo local, Traefik funciona principalmente como entrypoint HTTP
# El descubrimiento automático de servicios via Docker se configura en producción

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  debug: false

# Entry points
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

# Minimal provider for local testing
# En producción, se usará traefik-prod.yml con Docker provider completo
providers:
  # Docker provider desactivado para desarrollo local en Windows
  # Se activa solo en producción via docker-compose.prod.yml
  file:
    filename: /traefik/traefik-routes.yml
    watch: false

# Logging
log:
  level: INFO

